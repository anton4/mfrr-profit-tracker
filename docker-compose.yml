services:
  mfrr-tracker:
    build: .
    container_name: mfrr-tracker
    ports:
      - "8099:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - TZ=${TZ}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - SENSOR_SOURCE=${SENSOR_SOURCE}
      - SENSOR_MODE=${SENSOR_MODE}
      - SENSOR_POWERLIMIT=${SENSOR_POWERLIMIT}
      - SENSOR_GRID_POWER=${SENSOR_GRID_POWER}
      - SENSOR_NORDPOOL=${SENSOR_NORDPOOL}
      - KRATT_SHARE=${KRATT_SHARE:-0.20}
      - AFRR_PRICE_UP_EUR_MWH=${AFRR_PRICE_UP_EUR_MWH:-440}
      - AFRR_PRICE_DOWN_EUR_MWH=${AFRR_PRICE_DOWN_EUR_MWH:--530}
      - MFRR_PRICE_RECHECK_MIN=${MFRR_PRICE_RECHECK_MIN:-5}
      - FEE_MARGIN=${FEE_MARGIN:-}
      - FEE_ELEKTRILEVI_DAY=${FEE_ELEKTRILEVI_DAY:-}
      - FEE_ELEKTRILEVI_NIGHT=${FEE_ELEKTRILEVI_NIGHT:-}
      - FEE_VAT=${FEE_VAT:-}
      - ENTSOE_TOKEN=${ENTSOE_TOKEN:-}
      - ENTSOE_CBMP_AREA=${ENTSOE_CBMP_AREA:-10Y1001A1001A39I}
    restart: unless-stopped
