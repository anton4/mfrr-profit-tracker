# Builds the Home Assistant add-on image per architecture and pushes it to ghcr.io.
# Runs when the add-on version in mfrr_tracker/config.yaml changes (or by hand).
# After the first run, make the ghcr packages public (Package settings → Change visibility),
# otherwise Home Assistant can't pull them.
name: Add-on image

on:
  push:
    branches: [main]
    paths: [mfrr_tracker/config.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' mfrr_tracker/config.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mfrr-profit-tracker-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mfrr-profit-tracker-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.name=mFRR Profit Tracker
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
